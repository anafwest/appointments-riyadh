name: نشر الموقع على Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: التحقق من إعدادات النشر
        id: check
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CI_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$SA_JSON" ]; then
            echo "mode=sa" >> "$GITHUB_OUTPUT"
          elif [ -n "$CI_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: تنبيه — لا يوجد سر نشر (تم تخطي النشر)
        if: steps.check.outputs.mode == 'none'
        run: |
          echo "::warning::لم يُضبط FIREBASE_SERVICE_ACCOUNT ولا FIREBASE_TOKEN — تم تخطي النشر. أضف السر من إعدادات المستودع (Settings → Secrets and variables → Actions) ثم أعد تشغيل هذه الوحدة."

      - name: النشر بحساب الخدمة (FIREBASE_SERVICE_ACCOUNT)
        if: steps.check.outputs.mode == 'sa'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: anafwest-appointments
          channelId: live

      - name: النشر برمز CI (FIREBASE_TOKEN)
        if: steps.check.outputs.mode == 'token'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --non-interactive --no-clipboard --token "$FIREBASE_TOKEN"
